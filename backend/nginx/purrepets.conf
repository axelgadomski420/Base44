# PURRE PETS — Nginx (HTTP + HTTPS)
#
#   /            → frontend (vite preview)  127.0.0.1:3000
#   /api/        → backend Express          127.0.0.1:4000
#   /socket.io/  → backend (realtime)
#   /uploads/    → /var/www/purrepets/uploads, fallback do API

upstream purre_front {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream purre_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name purrepets.pl www.purrepets.pl 92.5.154.243;
    return 301 https://purrepets.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name purrepets.pl www.purrepets.pl 92.5.154.243;

    ssl_certificate /etc/letsencrypt/live/purrepets.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purrepets.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 80m;

    location /api/apps/public/login-info/ {
        proxy_pass http://purre_api/api/auth/login-info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://purre_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://purre_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /uploads/ {
        alias /var/www/purrepets/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri @uploads_api;
    }

    location @uploads_api {
        rewrite ^/uploads/(.*)$ /api/uploads/file/$1 break;
        proxy_pass http://purre_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://purre_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
