# PURRE PETS â Nginx reverse proxy (Oracle Cloud, Ubuntu 24.04)
#
#   /            â frontend Vite/React na 127.0.0.1:5173
#   /api/        â backend Node.js na 127.0.0.1:4000
#   /socket.io/  â backend Node.js (realtime)
#   /uploads/    â pliki z uploadu (na dysku serwera)
#
# Port 4000 NIE jest otwarty w Oracle Security List â backend osiÄgalny
# wyÅÄcznie przez Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name 92.5.154.243 purrepets.pl www.purrepets.pl;

    # Limity dla uploadu zdjÄÄ/wideo przekazywanego do backendu
    client_max_body_size 30m;

    # --- REST API ---
    # Shim: stara ÅcieÅ¼ka platformy Base44 odpytywana przez authMfaFlow (loadSignInOptions)
    location /api/apps/public/login-info/ {
        proxy_pass http://127.0.0.1:4000/api/auth/login-info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Socket.IO (wiadomoÅci realtime, aktualizacje portfela) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Pliki z uploadu (serwowane prosto z dysku) ---
    # ÅcieÅ¼ka musi wskazywaÄ na UPLOAD_DIR z .env backendu.
    location /uploads/ {
        alias /var/www/purrepets-backend/uploads/;
        expires 30d;
        access_log off;
        try_files $uri @backend_uploads;
    }

    location @backend_uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # --- Frontend (Vite/React na 127.0.0.1:5173) ---
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}

