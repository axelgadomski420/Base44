# PURRE PETS — Nginx reverse proxy (Oracle Cloud, Ubuntu 24.04)
#
#   /            → frontend Vite/React na 127.0.0.1:5173
#   /api/        → backend Node.js na 127.0.0.1:4000
#   /socket.io/  → backend Node.js (realtime)
#   /uploads/    → pliki z uploadu (na dysku serwera)
#
# Port 4000 NIE jest otwarty w Oracle Security List — backend osiągalny
# wyłącznie przez Nginx.

server {
    listen 80;
    listen [::]:80;
    server_name 92.5.154.243 purrepets.pl www.purrepets.pl;

    # Limity dla uploadu zdjęć/wideo przekazywanego do backendu
    client_max_body_size 30m;

    # --- REST API ---
    location /api/apps/public/login-info/ {
        proxy_pass http://127.0.0.1:4000/api/auth/login-info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Socket.IO (wiadomości realtime, aktualizacje portfela) ---
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Pliki z uploadu (serwowane prosto z dysku) ---
    location /uploads/ {
        alias /var/www/purrepets-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri @backend_uploads;
    }

    location @backend_uploads {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # --- Statyczne assety frontendu (cache 30 dni) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|eot|mp4|webm|mp3|wav|ogg)$ {
        proxy_pass http://127.0.0.1:5173;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --- Frontend (Vite/React na 127.0.0.1:5173) ---
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
