spring:
  application:
    name: purre-pets
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:purrepets}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

purre:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  crypto:
    documents-key: ${DOCUMENTS_ENCRYPTION_KEY:}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8100}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  coins:
    listing-publish-cost: 50
    listing-feature-cost: 100
    profile-boost-cost: 200
  arcade:
    daily-bonus-coins: 20
    streak-bonus-coins: 10
    daily-game-coins-cap: 300

logging:
  level:
    com.purre.pets: INFO
    org.springframework.security: WARN
