# PURRE PETS — CI (Node.js 22).
# Job 1 (lockfile): regeneruje package-lock.json w środowisku z npm (bez --force /
#   --legacy-peer-deps), weryfikuje npm ci i commituje zaktualizowany lockfile do gałęzi.
#   Push wykonany GITHUB_TOKEN nie wyzwala kolejnych workflow (brak pętli).
# Job 2 (test): npm ci → prisma migrate deploy (tylko efemeryczna baza CI!) → lint → build →
#   smoke-test artefaktów → start frontendu (Nitro) i backendu → pełny smoke-test HTTP →
#   start przez PM2 + weryfikacja HTTP. Produkcja NIE jest dotykana.
name: CI

on:
  push:
    branches: [fix/production-node-deployment, feature/node-nitro-migration]
  pull_request:
    branches: [fix/production-node-deployment, feature/node-nitro-migration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lockfile:
    name: Regeneracja i weryfikacja package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regeneruj lockfile (npm install --package-lock-only, bez --force)
        run: npm install --package-lock-only
      - name: Weryfikacja: npm ci przechodzi bez --force i --legacy-peer-deps
        run: npm ci
      - name: Weryfikacja backend: npm ci
        run: cd backend && npm ci
      - name: Commit zregenerowanego lockfile (jeśli się zmienił)
        run: |
          if ! git diff --quiet package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate package-lock.json (CI, Node 22, bez --force)"
            git push
            echo "LOCKFILE_UPDATED=1" >> "$GITHUB_ENV"
          else
            echo "Lockfile zgodny z package.json — bez zmian."
          fi

  test:
    name: Build + lint + smoke-test (Node 22, PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: purrepets
          POSTGRES_PASSWORD: purrepets_ci
          POSTGRES_DB: purrepets_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://purrepets:purrepets_ci@localhost:5432/purrepets_ci
      JWT_SECRET: ci-only-placeholder-not-a-real-secret
      NODE_ENV: production
      UPLOAD_DIR: ${{ github.workspace }}/backend/uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci (frontend)
        run: npm ci
      - name: npm ci (backend)
        run: cd backend && npm ci
      - name: Prisma generate + migrate deploy (wyłącznie efemeryczna baza CI)
        run: |
          cd backend
          npx prisma generate
          mkdir -p uploads
          npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Build (Vite + Nitro)
        run: npm run build
      - name: Smoke-test artefaktów (przed startem serwerów)
        run: SMOKE_ALLOW_OFFLINE=1 npm test
      - name: Start frontendu (Nitro node-server, 127.0.0.1:3000)
        run: |
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > front.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
      - name: Start backendu (Express, 127.0.0.1:4000)
        run: |
          cd backend && PORT=4000 node src/server.js > ../backend.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:4000/api/health && break
            sleep 1
          done
      - name: Pełny smoke-test HTTP (SSR /, /login, /robots.txt, /api/health)
        run: npm test
      - name: Test uruchomienia przez PM2
        run: |
          npm install -g pm2
          pkill -f '.output/server/index.mjs' || true
          pkill -f 'backend/src/server.js' || true
          sleep 2
          pm2 start ecosystem.config.cjs
          sleep 5
          curl -fsS http://127.0.0.1:3000/ | grep -qi '<html'
          curl -fsS http://127.0.0.1:4000/api/health | grep -q '"ok":true'
          pm2 ls
          pm2 kill
      - name: Logi diagnostyczne (przy porażce)
        if: failure()
        run: |
          echo '--- front.log ---'; tail -50 front.log || true
          echo '--- backend.log ---'; tail -50 backend.log || true
