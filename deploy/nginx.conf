# PURRE PETS — Nginx (bengos.pl)
# Frontend: pliki statyczne | API i WebSocket: proxy do Spring Boot :8080
# Porty publiczne: tylko 80/443. Backend, MySQL, Redis i AI nie są wystawione.

server {
    listen 80;
    listen [::]:80;
    server_name bengos.pl www.bengos.pl;

    client_max_body_size 120m;

    # ACME challenge
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        root /var/www/purre-pets;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Bundle z hashem — cache długi
    location ~* \.(js|css|woff2|svg|png|jpg|webp)$ {
        root /var/www/purre-pets;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket / STOMP (SockJS)
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Media (zdjęcia/wideo ogłoszeń)
    location /api/media/files/ {
        proxy_pass http://127.0.0.1:8080/media/files/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

# HTTPS — aktywuje Certbot (certbot --nginx) lub Cloudflare origin certificate.
# Po wystawieniu certyfikatu Certbot sam doda server :443 i przekierowanie 80→443.
